[project]
name = "medical-chatbot"
version = "0.1.0"
description = "End-to-end multi-agent medical chatbot with LangGraph, MCP, Groq, and Streamlit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "groq>=0.11.0",
    "mcp>=1.1.0,<2.0.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "streamlit>=1.39.0",
    "requests>=2.32.0",
    "biopython>=1.84",
    "tenacity>=9.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
